# GitHub secret scanning: paths whose "secrets" are test fixtures.
#
# `redact.rs` exists to recognise real secret shapes, so its test cases have to
# be shape-valid — an AWS key that no AWS validator would accept is not a test
# of the AWS pattern. Every one is syntactically real and semantically fake.
# Without this file, push protection may refuse the very first push of the
# public repository on those fixtures.
paths-ignore:
  - "crates/tp-ingest/src/redact.rs"
