[package]
name = "tp-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tp-core = { path = "../tp-core" }
tp-db = { path = "../tp-db" }
anyhow.workspace = true
rusqlite.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
base32 = "0.5"
base64 = "0.22"
sha2 = "0.10"
axum = "0.7"
# tls-rustls-no-provider, not tls-rustls: the plain feature silently re-enables
# rustls/aws-lc-rs, resurrecting the second crypto stack the line below is
# trying to avoid. The provider is installed explicitly — see tp-net tls.rs.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
# The ring provider, not the aws-lc-rs default. rcgen (self-signed peer
# certs) needs ring regardless, so aws-lc-rs meant compiling TWO crypto
# stacks, and aws-lc-sys is the single heaviest C build in this graph — the
# thing a from-source install on a slow machine or on Linux (no release
# binaries) pays for. One stack, the one already required. See tls.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# NOT "full". Cargo unifies features across the graph, so `full` here also
# switched on fs/process/io-std/signal for the whole build and made the
# deliberately minimal list in crates/tp/Cargo.toml a no-op — the binary
# linked all of tokio regardless, while that manifest said otherwise.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
httpsig = "0.0.26"

[dev-dependencies]
tempfile = "3"
tp-ingest = { path = "../tp-ingest" }

[lints]
workspace = true
